<section class="svc">
  <div class="svc__inner">

    <!-- Section header -->
    <div class="svc__header">
      <span class="svc__kicker">OUR EXPERTISE</span>
      <div class="svc__header-row">
        <h2 class="svc__title">Solutions That <em class="svc__em">Drive Growth</em></h2>
        <a href="/services" class="svc__view-all">View all services →</a>
      </div>
    </div>

    <!-- Accordion service rows -->
    <div class="svc__list">
      @for (svc of services; track svc.num; let i = $index) {
        <div
          class="svc__row"
          [class.svc__row--active]="activeIndex === i"
          (click)="setActive(i)"
          (mouseenter)="setActive(i)"
        >
          <!-- Row header: number + name + arrow -->
          <div class="svc__row-head">
            <span class="svc__num">{{ svc.num }}</span>
            <div class="svc__meta">
              <h3 class="svc__name">{{ svc.title }}</h3>
              <span class="svc__tag">{{ svc.tag }}</span>
            </div>
            <span class="svc__arrow">↗</span>
          </div>

          <!-- Expandable content: desc + thumbnail -->
          <div class="svc__expand">
            <div class="svc__expand-inner">
              <p class="svc__desc">{{ svc.desc }}</p>
              <div class="svc__thumb">
                <img [src]="svc.img" [alt]="svc.title">
              </div>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
